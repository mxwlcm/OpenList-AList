<!--
  OpenList / AList 防调试脚本 — 安全版

  功能：
  1. 禁用 F12 / Ctrl+Shift+I/J/C/K/U 等快捷键
  2. 禁用右键菜单

  ★ 与旧版的区别：
  去掉了「检测开发者工具后清空页面」的逻辑！
  旧版会误判（自己开 F12、浏览器缩放、部分手机内核、远程调试都会触发），
  把密码弹窗连同整个页面一起清空 —— 这就是弹窗闪一下消失的原因。
  温馨提示：前端脚本本质上无法真正阻止懂技术的人看源码，
  保留快捷键屏蔽和右键屏蔽已经足够应付普通用户。
-->
<script>
  (function() {
    // ===== 1. 禁用快捷键 =====
    document.addEventListener('keydown', function(e) {
      const key = e.key || e.keyCode;

      // F12
      if (key === 'F12' || key === 123) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }

      // Ctrl+Shift+I / J / C / K / M / S
      if ((e.ctrlKey || e.metaKey) && e.shiftKey) {
        const blocked = ['I', 'J', 'C', 'K', 'M', 'S', 'i', 'j', 'c', 'k', 'm', 's'];
        if (blocked.includes(key)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }

      // Ctrl+U（查看源代码）
      if ((e.ctrlKey || e.metaKey) && (key === 'U' || key === 'u' || key === 85)) {
        e.preventDefault();
        return false;
      }
    }, true);

    // ===== 2. 禁用右键菜单 =====
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      return false;
    }, true);
  })();
</script>
