<!--
  OpenList / AList 密码弹窗代码 — 粉红色主题版（含二维码弹窗）
  使用方式：
  1. 登录 OpenList 管理后台（访问 /@manage）
  2. 进入 设置 -> 全局 -> 自定义头部（customize_head）
  3. 将下方全部代码复制粘贴进去，保存
  4. 刷新前台页面即可生效
-->
<style>
  /* ========== 密码弹窗遮罩层 ========== */
  #site-password-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(4px);
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* 弹窗卡片通用 */
  .pwd-modal {
    background: #fff;
    border-radius: 12px;
    width: 90%;
    max-width: 420px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: slideUp 0.4s ease;
  }

  /* 标题栏 */
  .pwd-modal-header {
    background: #ec407a;
    color: #fff;
    padding: 16px 20px;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
    position: relative;
  }

  .pwd-modal-header::before {
    content: "🎀 ";
  }

  /* 内容区 */
  .pwd-modal-body {
    padding: 20px 24px;
  }

  .pwd-desc {
    color: #333;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 12px;
  }

  .pwd-desc .highlight {
    color: #ec407a;
    font-weight: 600;
    display: block;
    text-align: center;
  }

  .pwd-desc ul {
    margin: 8px 0;
    padding-left: 18px;
  }

  .pwd-desc li {
    margin: 4px 0;
    color: #555;
  }

  .pwd-tip {
    background: #fff8e1;
    border-left: 3px solid #ffa000;
    padding: 8px 12px;
    margin: 12px 0;
    font-size: 13px;
    color: #e65100;
    border-radius: 0 6px 6px 0;
  }

  .pwd-tip strong {
    color: #bf360c;
  }

  /* 输入框 */
  .pwd-input-wrap {
    position: relative;
    margin: 16px 0 8px;
  }

  .pwd-input-wrap input {
    width: 100%;
    padding: 12px 40px 12px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    box-sizing: border-box;
  }

  .pwd-input-wrap input:focus {
    border-color: #ec407a;
  }

  .pwd-input-wrap input.error {
    border-color: #e53935;
    background: #ffebee;
  }

  .pwd-toggle-eye {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #999;
    font-size: 16px;
    user-select: none;
  }

  .pwd-sub-text {
    font-size: 12px;
    color: #888;
    margin-top: 6px;
    text-align: center;
  }

  /* 错误提示 */
  .pwd-error-msg {
    color: #e53935;
    font-size: 13px;
    text-align: center;
    margin-top: 8px;
    min-height: 18px;
  }

  /* 按钮组 */
  .pwd-btn-group {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  .pwd-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }

  .pwd-btn-primary {
    background: #ec407a;
    color: #fff;
  }

  .pwd-btn-primary:hover {
    background: #d81b60;
  }

  .pwd-btn-secondary {
    background: #f06292;
    color: #fff;
  }

  .pwd-btn-secondary:hover {
    background: #ec407a;
  }

  /* ========== 二维码弹窗 ========== */
  #qr-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(4px);
    z-index: 100000;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.3s ease;
  }

  #qr-modal.show {
    display: flex;
  }

  .qr-modal-card {
    background: #fff;
    border-radius: 12px;
    width: 90%;
    max-width: 380px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: slideUp 0.4s ease;
  }

  .qr-modal-header {
    background: #ec407a;
    color: #fff;
    padding: 14px 20px;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    position: relative;
  }

  .qr-close-btn {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    color: #fff;
    border: none;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .qr-close-btn:hover {
    background: rgba(255,255,255,0.4);
  }

  .qr-modal-body {
    padding: 24px;
    text-align: center;
  }

  .qr-img-wrap {
    width: 180px;
    height: 180px;
    margin: 0 auto 16px;
    border: 2px dashed #ec407a;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #fff0f5;
  }

  .qr-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .qr-placeholder {
    color: #ec407a;
    font-size: 13px;
    text-align: center;
    padding: 10px;
  }

  .qr-gzh-text {
    font-size: 14px;
    color: #333;
    margin-bottom: 16px;
  }

  .qr-gzh-text strong {
    color: #ec407a;
  }

  .qr-steps-title {
    font-size: 14px;
    color: #666;
    margin-bottom: 10px;
    font-weight: 500;
  }

  .qr-steps {
    list-style: none;
    padding: 0;
    margin: 0 0 20px;
    text-align: left;
    display: inline-block;
  }

  .qr-steps li {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 6px 0;
    font-size: 13px;
    color: #555;
  }

  .qr-step-num {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ec407a;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .qr-back-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #ec407a;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }

  .qr-back-btn:hover {
    background: #d81b60;
  }

  /* 隐藏页面内容（未解锁时） */
  body.pwd-locked #root,
  body.pwd-locked .main,
  body.pwd-locked main {
    display: none !important;
  }

  /* 暗黑模式适配 */
  @media (prefers-color-scheme: dark) {
    .pwd-modal, .qr-modal-card {
      background: #1e1e1e;
    }
    .pwd-desc, .qr-gzh-text {
      color: #e0e0e0;
    }
    .pwd-desc li, .qr-steps li {
      color: #b0b0b0;
    }
    .pwd-input-wrap input {
      background: #2a2a2a;
      border-color: #444;
      color: #fff;
    }
    .pwd-input-wrap input:focus {
      border-color: #ec407a;
    }
    .pwd-sub-text {
      color: #888;
    }
    .qr-steps-title {
      color: #aaa;
    }
    .qr-img-wrap {
      background: #2a1a20;
      border-color: #ec407a;
    }
  }
</style>

<!-- ========== 密码输入弹窗 ========== -->
<div id="site-password-overlay">
  <div class="pwd-modal">
    <div class="pwd-modal-header">萌仙网盘</div>
    <div class="pwd-modal-body">
      <div class="pwd-desc">
        <span class="highlight">💖  打造最全最新最好用免费资源！ 💖</span>
        <ul>
          <li><a href="https://github.com/mxwlcm/OpenList-AList" target="_blank" style="color:#ec407a;text-decoration:none;">这里是免费网盘 ↗</a></li>
          <li>这里是免费网盘1</li>
          <li>这里是免费网盘2</li>
        </ul>
      </div>

      <div class="pwd-tip">
        📢 密码不定时更新，保障资源安全<br>
        <strong>客服微信：</strong> 123 &nbsp;或&nbsp;<strong>QQ：</strong> 123
      </div>

      <div class="pwd-input-wrap">
        <input
          type="password"
          id="site-pwd-input"
          placeholder="请输入获取到的密码"
          autocomplete="off"
        >
        <span class="pwd-toggle-eye" id="pwd-toggle-eye">👁️</span>
      </div>
      <div class="pwd-sub-text">密码需关注新公众号「董小坛」回复"密码"获取</div>

      <div class="pwd-error-msg" id="pwd-error-msg"></div>

      <div class="pwd-btn-group">
        <button class="pwd-btn pwd-btn-primary" id="pwd-submit-btn">确认访问</button>
        <button class="pwd-btn pwd-btn-secondary" id="pwd-get-btn">获取密码</button>
      </div>
    </div>
  </div>
</div>

<!-- ========== 二维码弹窗 ========== -->
<div id="qr-modal">
  <div class="qr-modal-card">
    <div class="qr-modal-header">
      获取网盘密码
      <button class="qr-close-btn" id="qr-close-btn">&times;</button>
    </div>
    <div class="qr-modal-body">
      <!-- 二维码图片：把下面 src 换成你的二维码图片链接 -->
      <div class="qr-img-wrap">
        <img id="qr-code-img" src="" alt="公众号二维码" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <div class="qr-placeholder" style="display:none">
          📷 请替换二维码图片<br>
          <small>修改代码中 qr-code-img 的 src</small>
        </div>
      </div>

      <div class="qr-gzh-text">
        关注新公众号 <strong>「董小坛」</strong>
      </div>

      <div class="qr-steps-title">操作步骤</div>
      <ul class="qr-steps">
        <li><span class="qr-step-num">1</span>微信扫描二维码关注公众号</li>
        <li><span class="qr-step-num">2</span>在公众号内回复关键字"密码"</li>
        <li><span class="qr-step-num">3</span>获取最新的访问密码</li>
      </ul>

      <button class="qr-back-btn" id="qr-back-btn">已获取，返回输入密码</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ==================== 配置区（请修改此处）====================
    const CONFIG = {
      // 访问密码（必须修改！）
      PASSWORD: "mxwlcm",

      // 二维码图片链接（必须替换成你自己的！）
      QR_CODE_URL: "https://your-domain.com/path/to/qrcode.png",

      // localStorage 存储键名（无需修改）
      STORAGE_KEY: "openlist_site_access_2026",

      // 密码有效期（小时），0 表示关闭浏览器就失效
      EXPIRE_HOURS: 0
    };
    // ============================================================

    // 检查是否已授权
    function isAuthorized() {
      try {
        const data = localStorage.getItem(CONFIG.STORAGE_KEY);
        if (!data) return false;
        const parsed = JSON.parse(data);
        if (!parsed.timestamp) return false;
        const now = Date.now();
        const expireMs = CONFIG.EXPIRE_HOURS * 60 * 60 * 1000;
        return (now - parsed.timestamp) < expireMs;
      } catch(e) {
        return false;
      }
    }

    // 保存授权状态
    function saveAuth() {
      localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify({
        timestamp: Date.now()
      }));
    }

    // 关闭密码弹窗
    function unlock() {
      const overlay = document.getElementById('site-password-overlay');
      if (overlay) {
        overlay.style.transition = 'opacity 0.4s ease';
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 400);
      }
      document.body.classList.remove('pwd-locked');
      saveAuth();
    }

    // 显示错误
    function showError(msg) {
      const errEl = document.getElementById('pwd-error-msg');
      const input = document.getElementById('site-pwd-input');
      if (errEl) errEl.textContent = msg;
      if (input) {
        input.classList.add('error');
        input.focus();
        setTimeout(() => input.classList.remove('error'), 1500);
      }
    }

    // 验证密码
    function verify() {
      const input = document.getElementById('site-pwd-input');
      if (!input) return;
      const val = input.value.trim();
      if (!val) {
        showError('请输入密码');
        return;
      }
      if (val === CONFIG.PASSWORD) {
        unlock();
      } else {
        showError('密码错误，请重新输入');
        input.value = '';
      }
    }

    // 显示二维码弹窗
    function showQrModal() {
      const qrModal = document.getElementById('qr-modal');
      if (qrModal) qrModal.classList.add('show');
    }

    // 隐藏二维码弹窗
    function hideQrModal() {
      const qrModal = document.getElementById('qr-modal');
      if (qrModal) qrModal.classList.remove('show');
    }

    // 初始化
    function init() {
      if (isAuthorized()) {
        const overlay = document.getElementById('site-password-overlay');
        const qrModal = document.getElementById('qr-modal');
        if (overlay) overlay.remove();
        if (qrModal) qrModal.remove();
        document.body.classList.remove('pwd-locked');
        return;
      }

      document.body.classList.add('pwd-locked');

      // 设置二维码图片
      const qrImg = document.getElementById('qr-code-img');
      if (qrImg && CONFIG.QR_CODE_URL) {
        qrImg.src = CONFIG.QR_CODE_URL;
      }

      // 绑定密码弹窗事件
      const submitBtn = document.getElementById('pwd-submit-btn');
      const getBtn = document.getElementById('pwd-get-btn');
      const input = document.getElementById('site-pwd-input');
      const eye = document.getElementById('pwd-toggle-eye');

      if (submitBtn) submitBtn.addEventListener('click', verify);
      if (getBtn) getBtn.addEventListener('click', showQrModal);
      if (input) {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') verify();
        });
      }
      if (eye) {
        eye.addEventListener('click', () => {
          const type = input.type === 'password' ? 'text' : 'password';
          input.type = type;
          eye.textContent = type === 'password' ? '👁️' : '🙈';
        });
      }

      // 绑定二维码弹窗事件
      const qrCloseBtn = document.getElementById('qr-close-btn');
      const qrBackBtn = document.getElementById('qr-back-btn');

      if (qrCloseBtn) qrCloseBtn.addEventListener('click', hideQrModal);
      if (qrBackBtn) qrBackBtn.addEventListener('click', hideQrModal);

      // 点击二维码弹窗背景关闭
      const qrModal = document.getElementById('qr-modal');
      if (qrModal) {
        qrModal.addEventListener('click', (e) => {
          if (e.target === qrModal) hideQrModal();
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
