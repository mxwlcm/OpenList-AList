<!--
  OpenList / AList 自定义底部备案信息（两行版）

  第一行：ICP 备案 | 公安备案
  第二行：© 网站名 | 管理后台

  使用方式：
  把下面全部代码粘贴到 OpenList 后台「设置 → 全局 → 自定义头部」
-->
<style>
  .footer {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    padding: 14px 10px !important;
    font-size: 12px !important;
    color: #888 !important;
    line-height: 1.8 !important;
  }

  .footer .footer-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 0;
  }

  .footer .footer-left {
    text-align: right;
    padding-right: 6px;
  }

  .footer .footer-right {
    text-align: left;
    padding-left: 6px;
  }

  .footer .footer-row .divider {
    text-align: center;
    color: #444;
  }

  .footer .footer-row + .footer-row {
    margin-top: 4px;
  }

  .footer a {
    color: #888 !important;
    text-decoration: none !important;
    transition: color 0.2s !important;
    display: inline-flex;
    align-items: center;
  }

  .footer a:hover {
    color: #ec407a !important;
  }

  .footer .divider {
    color: #444;
  }

  .footer .beian-icon {
    width: 14px;
    height: 14px;
    vertical-align: middle;
    margin-right: 3px;
  }
</style>

<script>
  (function() {
    // ==================== 配置区（请修改此处）====================
    const FOOTER_CONFIG = {
      // 网站名称
      SITE_NAME: "萌仙网盘",

      // 年份
      YEAR: "2026",

      // ICP 备案号（没有则留空字符串 ""）
      ICP_NUMBER: "京ICP备XXXXXXXX号-1",
      ICP_LINK: "https://beian.miit.gov.cn/",

      // ICP 备案图标链接（没有则留空字符串 ""）
      ICP_ICON: "",

      // 公安备案号（没有则留空字符串 ""）
      GONGAN_NUMBER: "京公网安备XXXXXXXXXXXXXX号",
      GONGAN_LINK: "https://www.beian.gov.cn/portal/registerSystemInfo?recordcode=XXXXXXXXXXXXXX",

      // 公安备案图标链接（没有则留空字符串 ""）
      GONGAN_ICON: "https://beian.mps.gov.cn/img/logo01.dd7ff50e.png",

      // 是否显示管理后台入口
      SHOW_MANAGE: true,
      MANAGE_TEXT: "管理后台",
      MANAGE_LINK: "/@manage"
    };
    // ============================================================

    function buildFooterHtml(cfg) {
      let html = '';

      // ===== 第一行：备案信息 =====
      html += '<div class="footer-row">';

      // ICP 备案（左边，右对齐）
      html += '<span class="footer-left">';
      if (cfg.ICP_NUMBER) {
        html += '<a href="' + cfg.ICP_LINK + '" target="_blank">';
        if (cfg.ICP_ICON) {
          html += '<img src="' + cfg.ICP_ICON + '" class="beian-icon" alt="ICP">';
        }
        html += cfg.ICP_NUMBER + '</a>';
      }
      html += '</span>';

      // 分隔符（中间，作为对齐基准）
      if (cfg.ICP_NUMBER && cfg.GONGAN_NUMBER) {
        html += '<span class="divider">|</span>';
      }

      // 公安备案（右边，左对齐）
      html += '<span class="footer-right">';
      if (cfg.GONGAN_NUMBER) {
        html += '<a href="' + cfg.GONGAN_LINK + '" target="_blank">';
        if (cfg.GONGAN_ICON) {
          html += '<img src="' + cfg.GONGAN_ICON + '" class="beian-icon" alt="公安备案">';
        }
        html += cfg.GONGAN_NUMBER + '</a>';
      }
      html += '</span>';

      html += '</div>';

      // ===== 第二行：版权 + 管理 =====
      html += '<div class="footer-row">';

      // 版权（左边，右对齐）
      html += '<span class="footer-left"><a href="https://doc.oplist.org/" target="_blank">由 OpenList 驱动</a></span>';

      // 分隔符（中间）
      if (cfg.SHOW_MANAGE) {
        html += '<span class="divider">|</span>';
      }

      // 管理后台（右边，左对齐）
      html += '<span class="footer-right">';
      if (cfg.SHOW_MANAGE) {
        html += '<a href="' + cfg.MANAGE_LINK + '">' + cfg.MANAGE_TEXT + '</a>';
      }
      html += '</span>';

      html += '</div>';

      return html;
    }

    const TARGET_HTML = buildFooterHtml(FOOTER_CONFIG);

    function forceReplace() {
      const footers = document.querySelectorAll('.footer');
      footers.forEach(footer => {
        if (footer.innerHTML !== TARGET_HTML) {
          footer.innerHTML = TARGET_HTML;
        }
      });
    }

    function init() {
      forceReplace();
      let count = 0;
      const interval = setInterval(() => {
        forceReplace();
        count++;
        if (count > 50) clearInterval(interval);
      }, 200);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    const observer = new MutationObserver(() => {
      forceReplace();
    });
    observer.observe(document.body, { childList: true, subtree: true });

    setInterval(forceReplace, 1000);
  })();
</script>
